    // Component for Pre-Lab and Post-Lab Interactive MCQ Quizzes
    function QuizModule({ quizType, practical, questions, userAnswers, submittedQuizzes, onSelectOption, onSubmitQuiz, onResetQuiz }) {
      const quizKey = `practical_${practical.id}_${quizType}`;
      const isSubmitted = submittedQuizzes[quizKey];

      // Calculate score if submitted
      let correctCount = 0;
      if (isSubmitted) {
        questions.forEach((q) => {
          const selOpt = userAnswers[`${quizKey}_${q.id}`];
          if (selOpt === q.correctIndex) {
            correctCount++;
          }
        });
      }

      const scorePercent = questions.length > 0 ? Math.round((correctCount / questions.length) * 100) : 0;

      return (
        <div className="glass-card p-6 rounded-2xl space-y-6 animate-fadeIn">
          {/* Header */}
          <div className="flex items-center justify-between border-b border-slate-800 pb-4">
            <div>
              <div className="flex items-center gap-2">
                <span className={`text-xs font-bold px-2.5 py-0.5 rounded-full font-mono uppercase ${
                  quizType === 'prelab' ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/30' : 'bg-purple-500/20 text-purple-300 border border-purple-500/30'
                }`}>
                  {quizType === 'prelab' ? 'Pre-Lab Assessment' : 'Post-Lab Evaluation'}
                </span>
                <span className="text-xs text-slate-400 font-mono">{questions.length} Questions</span>
              </div>
              <h3 className="text-lg font-bold text-white mt-1">
                {quizType === 'prelab' ? 'Pre-Laboratory Safety & Theory Quiz' : 'Post-Laboratory Analytical Quiz'}
              </h3>
            </div>

            {isSubmitted && (
              <div className="text-right">
                <div className="text-2xl font-extrabold font-mono text-cyan-400">
                  {scorePercent}%
                </div>
                <p className="text-xs text-slate-400">({correctCount}/{questions.length} Correct)</p>
              </div>
            )}
          </div>

          {/* Question Cards */}
          <div className="space-y-6">
            {questions.map((q, qIdx) => {
              const selectedOpt = userAnswers[`${quizKey}_${q.id}`];
              
              return (
                <div key={q.id} className="p-5 rounded-2xl bg-slate-900/80 border border-slate-800/80 space-y-4">
                  <div className="flex items-start gap-3">
                    <span className="w-6 h-6 rounded-lg bg-slate-800 text-slate-300 font-mono text-xs font-bold flex items-center justify-center shrink-0 mt-0.5">
                      Q{qIdx + 1}
                    </span>
                    <h4 className="text-sm font-bold text-slate-100 leading-snug">
                      {q.question}
                    </h4>
                  </div>

                  {/* Options Grid */}
                  <div className="grid grid-cols-1 gap-2.5 pl-9">
                    {q.options.map((opt, optIdx) => {
                      const isSelected = selectedOpt === optIdx;
                      const isCorrect = q.correctIndex === optIdx;
                      
                      let optionStyle = "bg-slate-950/60 border-slate-800 text-slate-300 hover:bg-slate-800/60 hover:border-slate-700";
                      
                      if (isSubmitted) {
                        if (isCorrect) {
                          optionStyle = "bg-emerald-500/20 border-emerald-500 text-emerald-200 font-semibold shadow-sm shadow-emerald-500/20";
                        } else if (isSelected && !isCorrect) {
                          optionStyle = "bg-rose-500/20 border-rose-500 text-rose-200 font-semibold";
                        } else {
                          optionStyle = "bg-slate-950/30 border-slate-800/50 text-slate-500 opacity-60";
                        }
                      } else if (isSelected) {
                        optionStyle = "bg-cyan-500/20 border-cyan-500 text-cyan-200 font-bold shadow-md shadow-cyan-500/10";
                      }

                      return (
                        <div
                          key={optIdx}
                          onClick={() => onSelectOption(quizKey, q.id, optIdx)}
                          className={`p-3.5 rounded-xl border text-xs cursor-pointer transition-all flex items-center justify-between gap-3 ${optionStyle}`}
                        >
                          <div className="flex items-center gap-3">
                            <span className="w-5 h-5 rounded-md border border-slate-700 font-mono flex items-center justify-center text-[10px] font-bold">
                              {String.fromCharCode(65 + optIdx)}
                            </span>
                            <span>{opt}</span>
                          </div>

                          {/* Post-submission indicator tags */}
                          {isSubmitted && (
                            <div>
                              {isCorrect && (
                                <span className="px-2 py-0.5 rounded bg-emerald-500/30 text-emerald-300 text-[10px] font-bold border border-emerald-500/40">
                                  Correct ✓
                                </span>
                              )}
                              {isSelected && !isCorrect && (
                                <span className="px-2 py-0.5 rounded bg-rose-500/30 text-rose-300 text-[10px] font-bold border border-rose-500/40">
                                  Incorrect ✗
                                </span>
                              )}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>

                  {/* Immediate Explanation Box when submitted */}
                  {isSubmitted && (
                    <div className="ml-9 p-3.5 rounded-xl bg-indigo-950/40 border border-indigo-500/30 text-xs space-y-1">
                      <div className="font-bold text-indigo-300 flex items-center gap-1.5">
                        <i data-lucide="info" className="w-4 h-4 text-indigo-400"></i>
                        Instructor Explanation:
                      </div>
                      <p className="text-indigo-100 leading-relaxed">{q.explanation}</p>
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {/* Action Buttons */}
          <div className="flex items-center justify-between border-t border-slate-800 pt-4">
            {!isSubmitted ? (
              <button
                onClick={() => onSubmitQuiz(quizKey)}
                className="w-full sm:w-auto px-6 py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-extrabold text-xs shadow-lg shadow-cyan-500/20 transition-all flex items-center justify-center gap-2"
              >
                <i data-lucide="check-circle" className="w-4 h-4"></i>
                Submit Answers & View Results
              </button>
            ) : (
              <button
                onClick={() => onResetQuiz(quizKey)}
                className="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs transition-all flex items-center gap-2"
              >
                <i data-lucide="rotate-ccw" className="w-4 h-4"></i>
                Retake Quiz
              </button>
            )}
          </div>
        </div>
      );
    }

    // Virtual Lab Simulators (Agarose Gel Electrophoresis & Spectrophotometer)
    function LabSimulatorsView() {
      const [activeSim, setActiveSim] = useState('gel'); // 'gel', 'nanodrop'

      // Gel Simulator State
      const [agarosePercent, setAgarosePercent] = useState(1.0);
      const [voltage, setVoltage] = useState(100);
      const [runTime, setRunTime] = useState(0);
      const [isRunning, setIsRunning] = useState(false);

      // Spectrophotometer State
      const [a260Val, setA260Val] = useState(0.850);
      const [a280Val, setA280Val] = useState(0.470);
      const [dilutionFactor, setDilutionFactor] = useState(1);

      // Gel run timer loop
      useEffect(() => {
        let timer;
        if (isRunning && runTime < 45) {
          timer = setInterval(() => {
            setRunTime(prev => prev + 1);
          }, 200);
        } else if (runTime >= 45) {
          setIsRunning(false);
        }
        return () => clearInterval(timer);
      }, [isRunning, runTime]);

      // Calculate Spectrophotometry outputs
      const conc = (a260Val * dilutionFactor * 50).toFixed(1);
      const ratio = a280Val > 0 ? (a260Val / a280Val).toFixed(2) : 0;

      let purityGrade = "Low Purity (Protein Contamination)";
      let purityColor = "text-rose-400";
      if (ratio >= 1.8 && ratio <= 2.0) {
        purityGrade = "Pure DNA Strand (Ideal 1.8 - 2.0)";
        purityColor = "text-emerald-400";
      } else if (ratio > 2.0) {
        purityGrade = "Possible RNA Contamination (>2.0)";
        purityColor = "text-amber-400";
      }

      return (
        <div className="space-y-6">
          {/* Simulator Selector Tabs */}
          <div className="flex items-center gap-2 border-b border-slate-800 pb-4">
            <button
              onClick={() => setActiveSim('gel')}
              className={`px-4 py-2.5 rounded-xl font-bold text-xs flex items-center gap-2 transition-all ${
                activeSim === 'gel'
                  ? 'bg-purple-600 text-white shadow-lg shadow-purple-600/30'
                  : 'bg-slate-900 text-slate-400 hover:text-white'
              }`}
            >
              <i data-lucide="layers" className="w-4 h-4"></i>
              Virtual Agarose Gel Electrophoresis Simulator
            </button>

            <button
              onClick={() => setActiveSim('nanodrop')}
              className={`px-4 py-2.5 rounded-xl font-bold text-xs flex items-center gap-2 transition-all ${
                activeSim === 'nanodrop'
                  ? 'bg-cyan-500 text-slate-950 shadow-lg shadow-cyan-500/20'
                  : 'bg-slate-900 text-slate-400 hover:text-white'
              }`}
            >
              <i data-lucide="gauge" className="w-4 h-4"></i>
              DNA Spectrophotometer ($A_{260}/A_{280}$) Calculator
            </button>
          </div>

          {/* SIMULATOR 1: AGAROSE GEL ELECTROPHORESIS */}
          {activeSim === 'gel' && (
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
              
              {/* Left Control Panel */}
              <div className="lg:col-span-5 glass-card p-6 rounded-2xl space-y-5">
                <h3 className="text-base font-bold text-purple-300 flex items-center gap-2">
                  <i data-lucide="sliders" className="w-5 h-5 text-purple-400"></i>

                <div>
                  <label className="block text-xs font-bold text-slate-300 mb-1">

                  </label>
                  <input
                    type="range"

                  <p className="text-[10px] text-slate-400 mt-1">Higher % retards small fragments for better resolution.</p>

                      <div className="w-8 h-2 bg-slate-800 rounded-sm mb-2 border border-slate-700"></div>
                      <div className="text-[9px] text-slate-500 font-mono absolute -top-1">L2</div>
                      <div className="w-7 h-1.5 bg-purple-400 shadow-[0_0_8px_#c084fc] rounded" style={{ top: `${Math.min(10 + runTime * 0.2, 30)}%`, position: 'absolute' }}></div>
                    </div>

                    {/* Lane 3: PCR Amplicon */}
                    <div className="flex flex-col items-center relative w-12">
                      <div className="w-8 h-2 bg-slate-800 rounded-sm mb-2 border border-slate-700"></div>
                      <div className="text-[9px] text-slate-500 font-mono absolute -top-1">L3</div>
                      <div className="w-7 h-1 bg-emerald-400 shadow-[0_0_8px_#34d399] rounded" style={{ top: `${Math.min(30 + runTime * 1.1, 88)}%`, position: 'absolute' }}></div>
                    </div>

                    {/* Lane 4: Restriction Digest Fragments */}
                    <div className="flex flex-col items-center relative w-12">
                      <div className="w-8 h-2 bg-slate-800 rounded-sm mb-2 border border-slate-700"></div>
                      <div className="text-[9px] text-slate-500 font-mono absolute -top-1">L4</div>
                      <div className="w-7 h-1 bg-rose-400 shadow-[0_0_8px_#fb7185] rounded" style={{ top: `${Math.min(20 + runTime * 1.3, 82)}%`, position: 'absolute' }}></div>
                      <div className="w-7 h-1 bg-rose-400 shadow-[0_0_8px_#fb7185] rounded" style={{ top: `${Math.min(50 + runTime * 0.8, 92)}%`, position: 'absolute' }}></div>
                    </div>

                  </div>

                  {/* Anode Bottom */}
                  <div className="w-full border-t-2 border-dashed border-rose-500/40 text-center text-[10px] text-rose-400 font-mono pt-1">
                    + ANODE (+) RED LEAD
                  </div>
                </div>
              </div>

            </div>
          )}

          {/* SIMULATOR 2: SPECTROPHOTOMETER CALCULATOR */}
          {activeSim === 'nanodrop' && (
            <div className="glass-card p-6 rounded-2xl max-w-3xl mx-auto space-y-6">
              <h3 className="text-lg font-bold text-cyan-300 flex items-center gap-2">
                <i data-lucide="calculator" className="w-5 h-5 text-cyan-400"></i>
                DNA Spectrophotometry Concentration & Purity Calculator
              </h3>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                  <label className="block text-xs font-bold text-slate-300 mb-1">A260 Absorbance Reading</label>
                  <input
                    type="number"
                    step="0.01"
                    value={a260Val}
                    onChange={(e) => setA260Val(parseFloat(e.target.value) || 0)}
                    className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-cyan-400 font-mono font-bold outline-none"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-300 mb-1">A280 Absorbance Reading</label>
                  <input
                    type="number"
                    step="0.01"
                    value={a280Val}
                    onChange={(e) => setA280Val(parseFloat(e.target.value) || 0)}
                    className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-purple-400 font-mono font-bold outline-none"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-300 mb-1">Dilution Factor (e.g. 1 or 50)</label>
                  <input
                    type="number"
                    value={dilutionFactor}
                    onChange={(e) => setDilutionFactor(parseInt(e.target.value) || 1)}
                    className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 font-mono outline-none"
                  />
                </div>
              </div>

              {/* Calculated Results Box */}
              <div className="p-6 rounded-2xl bg-slate-900/90 border border-slate-800 space-y-4">
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className="p-4 rounded-xl bg-slate-950 border border-slate-800">
                    <span className="text-xs text-slate-400 uppercase font-bold">DNA Concentration</span>
                    <div className="text-2xl font-extrabold font-mono text-cyan-400 mt-1">
                      {conc} <span className="text-xs text-slate-400">µg/mL</span>
                    </div>
                  </div>

                  <div className="p-4 rounded-xl bg-slate-950 border border-slate-800">
                    <span className="text-xs text-slate-400 uppercase font-bold">A260 / A280 Purity Ratio</span>
                    <div className="text-2xl font-extrabold font-mono text-purple-400 mt-1">
                      {ratio}
                    </div>
                  </div>
                </div>

                <div className="p-3.5 rounded-xl bg-slate-950/60 border border-slate-800 text-xs flex items-center justify-between">
                  <span className="font-bold text-slate-300">Purity Status Assessment:</span>
                  <span className={`font-extrabold ${purityColor}`}>{purityGrade}</span>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Student Progress Tracking Component
    function StudentProgressView({ practicals, submittedQuizzes, userAnswers }) {
      let totalQuizzesSubmitted = 0;
      let totalCorrect = 0;
      let totalQuestions = 0;

      practicals.forEach((p) => {
        ['prelab', 'postlab'].forEach((type) => {
          const key = `practical_${p.id}_${type}`;
          const qList = type === 'prelab' ? p.preLabMCQs : p.postLabMCQs;

          if (submittedQuizzes[key]) {
            totalQuizzesSubmitted++;
            qList.forEach((q) => {
              totalQuestions++;
              if (userAnswers[`${key}_${q.id}`] === q.correctIndex) {
                totalCorrect++;
              }
            });
          }
        });
      });

      const overallPercent = totalQuestions > 0 ? Math.round((totalCorrect / totalQuestions) * 100) : 0;

      return (
        <div className="space-y-6 animate-fadeIn">
          <div className="glass-card p-6 rounded-2xl space-y-4">
            <h2 className="text-xl font-extrabold text-white flex items-center gap-2">
              <i data-lucide="award" className="w-6 h-6 text-emerald-400"></i>
              Student Overall Lab Performance Summary
            </h2>

            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div className="p-4 rounded-xl bg-slate-900/80 border border-slate-800">
                <span className="text-xs text-slate-400 font-bold uppercase">Quizzes Completed</span>
                <div className="text-2xl font-extrabold font-mono text-cyan-400 mt-1">
                  {totalQuizzesSubmitted} / 20
                </div>
              </div>

              <div className="p-4 rounded-xl bg-slate-900/80 border border-slate-800">
                <span className="text-xs text-slate-400 font-bold uppercase">Correct Responses</span>
                <div className="text-2xl font-extrabold font-mono text-purple-400 mt-1">
                  {totalCorrect} / {totalQuestions}
                </div>
              </div>

              <div className="p-4 rounded-xl bg-slate-900/80 border border-slate-800">
                <span className="text-xs text-slate-400 font-bold uppercase">Overall Accuracy Score</span>
                <div className="text-2xl font-extrabold font-mono text-emerald-400 mt-1">
                  {overallPercent}%
                </div>
              </div>
            </div>
          </div>

          {/* Table breakdown per practical */}
          <div className="glass-card p-6 rounded-2xl space-y-4">
            <h3 className="text-sm font-bold text-slate-200">Practical Module Completion Audit</h3>
            
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs text-slate-300">
                <thead className="bg-slate-900 text-slate-400 font-mono uppercase">
                  <tr>
                    <th className="p-3">Practical Title</th>
                    <th className="p-3">Pre-Lab Status</th>
                    <th className="p-3">Post-Lab Status</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800">
                  {practicals.map((p) => {
                    const preDone = submittedQuizzes[`practical_${p.id}_prelab`];
                    const postDone = submittedQuizzes[`practical_${p.id}_postlab`];

                    return (
                      <tr key={p.id} className="hover:bg-slate-900/40">
                        <td className="p-3 font-semibold text-slate-200">{p.title}</td>
                        <td className="p-3">
                          {preDone ? (
                            <span className="px-2 py-1 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-bold">Completed ✓</span>
                          ) : (
                            <span className="text-slate-500">Pending</span>
                          )}
                        </td>
                        <td className="p-3">
                          {postDone ? (
                            <span className="px-2 py-1 rounded bg-purple-500/20 text-purple-400 border border-purple-500/30 font-bold">Completed ✓</span>
                          ) : (
                            <span className="text-slate-500">Pending</span>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // Instructor Portal View
    function InstructorPortalView({ practicals, onEditPractical, onOpenAddQuestion }) {
      return (
        <div className="space-y-6 animate-fadeIn">
          <div className="glass-card p-6 rounded-2xl space-y-2">
            <div className="flex items-center justify-between">
              <h2 className="text-xl font-extrabold text-white flex items-center gap-2">
                <i data-lucide="user-check" className="w-6 h-6 text-purple-400"></i>
                Instructor Practical & Quiz Management Portal
              </h2>
              <button
                onClick={onOpenAddQuestion}
                className="px-4 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs flex items-center gap-2 shadow-lg shadow-cyan-500/20"
              >
                <i data-lucide="plus" className="w-4 h-4"></i>
                Add New MCQ Question
              </button>
            </div>
            <p className="text-xs text-slate-400">
              Modify video links, edit practical descriptions, manage pre-lab & post-lab questions, and customize answers for your students.
            </p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {practicals.map((p) => (
              <div key={p.id} className="p-5 rounded-2xl bg-slate-900/80 border border-slate-800 space-y-3 flex flex-col justify-between">
                <div>
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-mono font-bold text-cyan-400">Module #{p.id}</span>
                    <span className="text-[10px] text-slate-400 bg-slate-800 px-2 py-0.5 rounded">
                      {p.preLabMCQs.length + p.postLabMCQs.length} Questions
                    </span>
                  </div>
                  <h3 className="text-sm font-bold text-white mt-1">{p.title}</h3>
                  <p className="text-xs text-slate-400 line-clamp-2 mt-1">{p.description}</p>
                </div>

                <div className="pt-2 border-t border-slate-800/80 flex items-center justify-between">
                  <span className="text-[10px] text-slate-400 truncate max-w-[200px]">
                    Video: {p.videoUrl}
                  </span>
                  <button
                    onClick={() => onEditPractical(p)}
                    className="px-3 py-1.5 rounded-lg bg-purple-600/30 text-purple-300 hover:bg-purple-600 hover:text-white border border-purple-500/30 text-xs font-bold transition-all"
                  >
                    Manage & Edit
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);

  </script>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes scaleUp {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.25s ease-out forwards;
    }
    .animate-scaleUp {
      animation: scaleUp 0.2s ease-out forwards;
    }
  </style>
</body>
</html>
